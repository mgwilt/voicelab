[project]
name = "voicelab-web"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pipecat-ai[webrtc]",
    "voicelab-core",
    "voicelab-models",
    "voicelab-inference",
    "anyio>=4.15.1",
    "numpy>=2.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
voicelab-web = "voicelab_web.main:main"

[tool.uv.sources]
pipecat-ai = { git = "https://github.com/pipecat-ai/pipecat.git", rev = "82c4fdb484db32e3ef933d03c59a395dd7f9a53b" }
voicelab-core = { workspace = true }
voicelab-models = { workspace = true }
voicelab-inference = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
