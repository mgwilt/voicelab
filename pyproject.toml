[project]
name = "voicelab-workspace"
version = "0.1.0"
description = "Workspace for building and evaluating voice AI models."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.ruff]
extend-include = ["voicelab"]
target-version = "py314"
extend-exclude = [".local", "artifacts", "third_party/misaki/misaki"]
src = ["packages/*/src", "apps/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "PGH"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ty.src]
exclude = [".local/**", "artifacts/**", "third_party/misaki/misaki/**"]
