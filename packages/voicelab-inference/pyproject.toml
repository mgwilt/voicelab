[project]
name = "voicelab-inference"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["src/voicelab_inference/sesame/torch/LICENSE", "src/voicelab_inference/sesame/torch/NOTICE", "src/voicelab_inference/breeze/mlx/LICENSE", "src/voicelab_inference/breeze/mlx/NOTICE", "src/voicelab_inference/kokoro/mlx/LICENSE", "src/voicelab_inference/kokoro/mlx/NOTICE", "src/voicelab_inference/ming_tts/mlx/LICENSE", "src/voicelab_inference/ming_tts/mlx/NOTICE", "src/voicelab_inference/ming_audio/mlx/LICENSE", "src/voicelab_inference/ming_audio/mlx/NOTICE", "src/voicelab_inference/personaplex/mlx/LICENSE", "src/voicelab_inference/personaplex/mlx/LICENSE-mlx-reference", "src/voicelab_inference/personaplex/mlx/NOTICE", "src/voicelab_inference/phonon/torch/LICENSE", "src/voicelab_inference/phonon/torch/NOTICE", "src/voicelab_inference/drama/mlx/LICENSE", "src/voicelab_inference/drama/mlx/NOTICE", "src/voicelab_inference/nemotron/mlx/LICENSE", "src/voicelab_inference/nemotron/mlx/LICENSE-nvidia", "src/voicelab_inference/nemotron/mlx/NOTICE", "src/voicelab_inference/qwen_omni/mlx/LICENSE-mlx-vlm", "src/voicelab_inference/qwen_omni/mlx/NOTICE", "src/voicelab_inference/minicpm/native/LICENSE", "src/voicelab_inference/minicpm/native/NOTICE"]
dependencies = [
    "voicelab-core",
    "voicelab-models",
    "numpy>=2.0",
    "torch==2.14.1",
    "transformers==5.22.1",
    "accelerate>=1.15.0",
    "soundfile>=0.14.0",
    "kittenml==0.9.7",
    "omnivoice==0.2.1",
    "scipy==1.18.1",
    "pyloudnorm==0.2.0",
    "onnxruntime==1.31.1",
    "torchaudio==2.11.1",
    "websockets==17.4",
    "huggingface-hub==2.4.0",
]

[project.optional-dependencies]
mlx = [
    "mlx-vlm==0.7.11; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio==0.6.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "phonemizer==3.4.0",
    "espeakng-loader==0.2.4",
    "misaki[en,ja,zh]==0.9.4",
    "en-core-web-sm",
]

[tool.uv.sources]
voicelab-core = { workspace = true }
voicelab-models = { workspace = true }
misaki = { path = "../../third_party/misaki" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
